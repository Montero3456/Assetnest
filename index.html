<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AssetNest</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <!-- Website Style -->
    <link rel="stylesheet" href="styles.css">

</head>


<body>


<header>


    <div class="logo">
        AssetNest
    </div>


    <input 
        id="search"
        type="text"
        placeholder="Search Roblox assets..."
    >


    <a href="upload.html" class="upload-btn">
        Upload
    </a>


</header>



<main>


<section class="hero">


    <h1>
        Roblox Assets Made Simple
    </h1>


    <p>
        Upload, share, and download RBXM and RBXL files instantly.
    </p>


</section>




<section class="categories">


    <button>
        Models
    </button>


    <button>
        Maps
    </button>


    <button>
        Scripts
    </button>


    <button>
        UI
    </button>


    <button>
        Vehicles
    </button>


    <button>
        Other
    </button>


</section>





<section>

    <div id="assetGrid" class="asset-grid">

        <div style="
            grid-column:1/-1;
            text-align:center;
            padding:80px;
            color:#64748B;
        ">

            <h2>
                Loading assets...
            </h2>

            <p>
                Connecting to AssetNest database
            </p>

        </div>


    </div>


</section>



</main>




<footer>

    <p>
        © 2026 AssetNest
    </p>

</footer>





<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- Supabase Connection -->
<script src="supabase.js"></script>


<!-- Website Logic -->
<script src="script.js"></script>


</body>

</html>
