<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetNest</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>

    <div class="logo">
        AssetNest
    </div>

    <input
        type="text"
        id="search"
        placeholder="Search assets..."
    >

    <a href="upload.html" class="upload-btn">
        Upload
    </a>

</header>

<main>

    <section class="hero">

        <h1>
            Discover Roblox Assets
        </h1>

        <p>
            Share and download .rbxm and .rbxl files instantly.
        </p>

    </section>

    <section class="categories">

        <button>Models</button>
        <button>Scripts</button>
        <button>Maps</button>
        <button>UI</button>
        <button>Plugins</button>
        <button>Vehicles</button>

    </section>

    <section id="assetGrid" class="asset-grid">

        <!-- Assets will appear here -->

    </section>

</main>

<footer>

    <p>
        © 2026 AssetNest
    </p>

</footer>

<script src="script.js"></script>

</body>
</html>
