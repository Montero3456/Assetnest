<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload - AssetNest</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>


<header>

    <div class="logo">
        AssetNest
    </div>


    <a href="index.html" class="upload-btn">
        Home
    </a>

</header>



<main>


<section class="hero">

    <h1>
        Upload Asset
    </h1>

    <p>
        Share your Roblox creations with developers.
    </p>

</section>



<section class="upload-box">


<input
    id="assetTitle"
    type="text"
    placeholder="Asset title"
>



<textarea
    id="assetDescription"
    placeholder="Describe your asset">
</textarea>



<select id="assetCategory">

    <option value="Models">
        Models
    </option>

    <option value="Maps">
        Maps
    </option>

    <option value="Scripts">
        Scripts
    </option>

    <option value="UI">
        UI
    </option>

    <option value="Vehicles">
        Vehicles
    </option>

    <option value="Other">
        Other
    </option>

</select>



<input
    id="assetFile"
    type="file"
    accept=".rbxm,.rbxl"
>



<button id="uploadButton">
    Upload Asset
</button>


<p id="uploadStatus"></p>


</section>


</main>



<footer>

    <p>
        © 2026 AssetNest
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="upload.js"></script>


</body>

</html>
